services:
  app:
    build: .
    container_name: shopify-dynamic-review-system
    restart: unless-stopped
    ports:
      - "11004:11004"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "11004"
      HOST: "0.0.0.0"
      SHOPIFY_APP_URL: "http://172.168.18.126:11004"
      DATABASE_URL: "file:/app/prisma/prod.sqlite"
    volumes:
      - ./prisma:/app/prisma
