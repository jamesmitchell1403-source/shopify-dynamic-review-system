# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d97376e1be723a9166b7ec705c55c610"
name = "AI Dynamic Review System"
application_url = "https://productreview.zooq.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "james-practice-tiwriyta.myshopify.com"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
scopes = "read_themes,write_themes,read_products,read_orders"

[app_proxy]
url = "https://productreview.zooq.app/apps/reviews"
subpath = "reviews"
prefix = "apps"

[auth]
redirect_urls = [
  "https://productreview.zooq.app/auth/callback",
  "https://productreview.zooq.app/auth/shopify/callback",
  "https://productreview.zooq.app/api/auth"
]
